<IfModule mpm_prefork_module>
	# Tuned for local dev envs. Idle envs hold 2–4 workers instead of the package default of
	# 8–11, cutting per-env memory from ~400 MB to ~200 MB at rest. MaxRequestWorkers 25 is
	# enough for one developer's traffic; production values are not appropriate here.
	# MaxConnectionsPerChild 500 recycles workers after 500 requests, preventing PHP memory
	# from accumulating in long-lived processes.
	StartServers		 2
	MinSpareServers		 2
	MaxSpareServers		 4
	MaxRequestWorkers	 25
	MaxConnectionsPerChild	 500
</IfModule>

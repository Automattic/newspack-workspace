<IfModule mpm_prefork_module>
	# Sized for a local dev env that serves one developer. An idle env keeps 2 to 4 workers,
	# at most 25 run at once (further requests queue), and a worker exits after 500 requests
	# so the memory PHP accumulated in it is released.
	StartServers		 2
	MinSpareServers		 2
	MaxSpareServers		 4
	MaxRequestWorkers	 25
	MaxConnectionsPerChild	 500
</IfModule>

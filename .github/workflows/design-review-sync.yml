name: Sync design-review labels and reviewers

on:
  pull_request:
    types: [labeled, review_requested]

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    name: Sync design-review labels and reviewers
    runs-on: ubuntu-latest
    steps:
      - name: Sync labels and reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const NEEDS_DESIGN    = '[Status] Needs Design Review';
            const DESIGN_APPROVED = '[Status] Design Approved';
            const NEEDS_CHANGES   = '[Status] Needs Changes or Feedback';
            const TEAM_SLUG       = 'newspack-design';

            // Behavior 1 requests an INDIVIDUAL reviewer instead of the
            // @Automattic/newspack-design team. The automatic GITHUB_TOKEN is
            // repo-scoped and cannot resolve an org team, so requesting the team
            // fails with 422 "Could not resolve to a node"; org/team read cannot
            // be granted to GITHUB_TOKEN. 'thomasguillot' is currently the sole
            // member of the newspack-design team, so requesting them fulfills the
            // intent (route the PR to design review) without an org-scoped token.
            // IMPORTANT: if that username changes, or the design team gains/loses
            // members, UPDATE THIS VALUE — or migrate Behavior 1 to an org-scoped
            // token / GitHub App that can request the team directly.
            const DESIGN_REVIEWER = 'thomasguillot';

            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const action = context.payload.action;

            const addLabel = async ( name ) => {
              await github.rest.issues.addLabels(
                { owner, repo, issue_number: number, labels: [ name ] }
              );
            };

            const removeLabelSafe = async ( name ) => {
              try {
                await github.rest.issues.removeLabel(
                  { owner, repo, issue_number: number, name }
                );
              } catch ( error ) {
                if ( error.status !== 404 ) throw error;
              }
            };

            // Latest non-comment review per reviewer; true if any is CHANGES_REQUESTED.
            // listReviews returns reviews in ascending submission order, so the last
            // write per reviewer id wins.
            const hasOutstandingChangesRequested = async () => {
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                { owner, repo, pull_number: number }
              );
              const latestByUser = new Map();
              for ( const review of reviews ) {
                if ( ! review.user ) continue;
                if ( ! [ 'APPROVED', 'CHANGES_REQUESTED', 'DISMISSED' ].includes( review.state ) ) {
                  continue;
                }
                latestByUser.set( review.user.id, review.state );
              }
              return [ ...latestByUser.values() ].includes( 'CHANGES_REQUESTED' );
            };

            if ( action === 'labeled' ) {
              const label = context.payload.label && context.payload.label.name;

              if ( label === NEEDS_DESIGN ) {
                await removeLabelSafe( DESIGN_APPROVED );
                // GitHub rejects requesting the PR author as their own reviewer,
                // so skip that case. Failures to request a reviewer should not
                // fail the run (this is label hygiene, not a gate) — warn instead.
                if ( context.payload.pull_request.user.login !== DESIGN_REVIEWER ) {
                  try {
                    await github.rest.pulls.requestReviewers(
                      { owner, repo, pull_number: number, reviewers: [ DESIGN_REVIEWER ] }
                    );
                  } catch ( error ) {
                    core.warning(
                      `Could not request review from ${ DESIGN_REVIEWER }: ${ error.message }`
                    );
                  }
                }
                return;
              }

              if ( label === DESIGN_APPROVED ) {
                await removeLabelSafe( NEEDS_DESIGN );
                if ( ! ( await hasOutstandingChangesRequested() ) ) {
                  await removeLabelSafe( NEEDS_CHANGES );
                }
                return;
              }

              return;
            }

            if ( action === 'review_requested' ) {
              const team = context.payload.requested_team;
              if ( ! team || team.slug !== TEAM_SLUG ) return;
              await addLabel( NEEDS_DESIGN );
              await removeLabelSafe( DESIGN_APPROVED );
              return;
            }

name: Release to WordPress.org

# Monorepo-aware WP.org deploy, called once per wp.org-distributed plugin from
# release.yml. Replaces the external newspack-scripts reusable workflow, which
# assumed a single-plugin repo (root-level `release:archive`, `npm ci`, and a
# `vX.Y.Z` git tag) and does not work in this pnpm monorepo.

on:
  workflow_call:
    inputs:
      plugin-name:
        description: 'WordPress.org plugin slug (also the release/ subdirectory name).'
        required: true
        type: string
      plugin-path:
        description: 'Path to the plugin within the monorepo, e.g. plugins/newspack-newsletters.'
        required: true
        type: string
      wporg-slug:
        description: 'WordPress.org slug, if it differs from plugin-name. Defaults to plugin-name.'
        required: false
        default: ''
        type: string
      released-tags:
        description: >-
          Newline-separated `<pkg>@<version>` tags created by the release job
          that called this workflow. Only meaningful with require-release.
        required: false
        default: ''
        type: string
      require-release:
        description: >-
          True when released-tags is the authoritative record of what this run
          published -- i.e. called from release.yml. The gate then skips a
          plugin absent from the list and fails on a version mismatch. False
          (manual dispatch) deploys the resolved version as-is. Kept separate
          from released-tags so an empty list reads as "nothing released"
          rather than "not supplied".
        required: false
        default: false
        type: boolean
    secrets:
      WP_ORG_USERNAME:
        required: true
      WP_ORG_PASSWORD:
        required: true

env:
  PNPM_VERSION: 10.33.0

jobs:
  release-wporg:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the branch tip, NOT the default `github.sha`.
          #
          # `github.sha` is the commit that triggered the run. By the time this
          # job runs, the release job has already pushed the version bump
          # ("chore(release): sync package.json versions [skip ci]", see
          # release.yml), so the trigger commit still carries the PREVIOUS
          # version. Resolving the version from it deployed the last release
          # over and over -- and passed silently, because that version was
          # already published (the deploy script's already-exists short-circuit).
          #
          # `needs: release` in the caller guarantees the bump is pushed before
          # this checkout runs, so the branch tip is the released commit.
          ref: ${{ github.ref_name }}
      - name: Resolve released version
        # Read before the build: the gate below can then skip a no-op run
        # without paying for install + build.
        id: ver
        run: echo "version=$(node -p "require('./${{ inputs.plugin-path }}/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check this plugin released in this run
        # Guards against the class of failure described on the checkout above:
        # a version resolved from the wrong commit. Given the release job's tag
        # list, the resolved version must match the tag this run created.
        #   - no tag for this plugin  -> nothing released, skip cleanly.
        #   - tag at a different version -> the checkout is stale, fail loudly.
        #   - tag at the resolved version -> deploy.
        id: gate
        env:
          RELEASED_TAGS: ${{ inputs.released-tags }}
          REQUIRE_RELEASE: ${{ inputs.require-release }}
          PLUGIN_NAME: ${{ inputs.plugin-name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$REQUIRE_RELEASE" != "true" ]; then
            echo "::notice::Manual deploy; publishing the resolved version $VERSION."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          released=$(printf '%s\n' "$RELEASED_TAGS" | { grep -E "^${PLUGIN_NAME}@" || true; })
          if [ -z "$released" ]; then
            echo "::notice::$PLUGIN_NAME had no release in this run. Nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "$released" | grep -qxF "${PLUGIN_NAME}@${VERSION}"; then
            echo "::error::This run released [$(printf '%s' "$released" | tr '\n' ' ')] but the checked-out tree resolves to $VERSION. The checkout is stale -- refusing to deploy the wrong version."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.gate.outputs.deploy == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.deploy == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        if: steps.gate.outputs.deploy == 'true'
        with:
          php-version: '8.3'
          tools: composer
      - name: Install JS dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install PHP dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: composer install --no-dev --no-scripts
        working-directory: ${{ inputs.plugin-path }}
      - name: Build shared packages
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm run build:packages
      - name: Build plugin and release artifact
        if: steps.gate.outputs.deploy == 'true'
        run: |
          pnpm --filter "{${{ inputs.plugin-path }}}" run --if-present build
          pnpm --filter "{${{ inputs.plugin-path }}}" run release:archive
      - name: Install Subversion
        # ubuntu-latest no longer ships svn; the deploy script needs it (both
        # the already-published check and the commit).
        if: steps.gate.outputs.deploy == 'true'
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Deploy to WordPress.org
        if: steps.gate.outputs.deploy == 'true'
        working-directory: ${{ inputs.plugin-path }}
        env:
          WP_ORG_USERNAME: ${{ secrets.WP_ORG_USERNAME }}
          WP_ORG_PASSWORD: ${{ secrets.WP_ORG_PASSWORD }}
          WP_ORG_PLUGIN_NAME: ${{ inputs.plugin-name }}
          WP_ORG_PLUGIN_SLUG: ${{ inputs.wporg-slug != '' && inputs.wporg-slug || inputs.plugin-name }}
          WP_ORG_PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
        run: ${{ github.workspace }}/.github/scripts/release-wporg.sh

name: Release skip-marker safety net

# GitHub drops every push-triggered workflow when the pushed commit's message
# carries a skip marker anywhere in it, body included. The marker is meant for
# the release bot's own commits, where it sits in the subject. A merge commit
# whose body quotes one of those commits trips the same rule, and the release
# the merge was meant to start never runs (#1287).
#
# This starts that release. It reads the merge commit of a pull request merged
# into `release` or `alpha`, and dispatches release.yml when a marker appears
# only below the subject line. A marker in the subject is left alone: that is
# someone asking for the skip. It also dispatches when the message is too long
# to read in full and the push started no Release run.
#
# On `release`, a release started this way merges `release` into `alpha`
# afterwards and never resets it (see ALPHA_SYNC in release.yml).
#
# pull_request_target rather than pull_request, because a skip marker on the
# pull request's head commit silences pull_request runs too, and GitHub
# documents pull_request_target as exempt. Nothing from the pull request is
# checked out or run here, so the token this event grants never meets PR code.
#
# GitHub runs a pull_request_target workflow from the default branch's copy,
# whatever the pull request's base. This file does nothing until the default
# branch carries it, and a change made only on `release` or `alpha` has no
# effect.
#
# Only release.yml has a manual trigger, so CI and the merge feed still do not
# run for the skipped push.

on:
  pull_request_target:
    types: [closed]
    branches:
      - release
      - alpha

permissions:
  actions: write
  contents: read

jobs:
  start-release:
    name: Start a release that a quoted skip marker silenced
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release.yml when a skip marker silenced the push
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # The five spellings GitHub honours, matching the plan step in
          # release.yml.
          has_marker() {
            case "$1" in
              *'[skip ci]'*|*'[ci skip]'*|*'[no ci]'*|*'[skip actions]'*|*'[actions skip]'*) return 0 ;;
              *) return 1 ;;
            esac
          }

          message=$(gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA" --jq '.commit.message')
          subject=${message%%$'\n'*}

          if has_marker "$subject"; then
            echo "::notice::$MERGE_SHA carries a skip marker in its subject, so the skip is treated as deliberate."
            exit 0
          fi

          if has_marker "$message"; then
            reason="The body of $MERGE_SHA quotes a skip marker, so GitHub started no workflow for this push to $BASE_REF."
          elif [ "$(printf '%s' "$message" | wc -c)" -lt 65000 ]; then
            echo "No skip marker in $MERGE_SHA; the push started its own runs."
            exit 0
          else
            # The API returns only the first 64 KiB of a message, and a merge
            # that lists its commits runs well past that (#1287 was 115 KB), so
            # a marker may sit beyond what was read. The message cannot settle
            # it; whether the push started a Release run can. The test above
            # stops short of the API's limit so it does not depend on how the
            # API ends a cut-off message.
            #
            # The wait gives the push's run time to register. If it registers
            # later still, the dispatch is a duplicate: the two runs queue, the
            # second starts behind the first's release commits, and on
            # `release` it fails at the plan step. That is one red run, not a
            # second publish.
            sleep 60
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --commit "$MERGE_SHA" --event push --json databaseId --jq 'length')
            if [ "$runs" -gt 0 ]; then
              echo "The message of $MERGE_SHA is longer than the API returns, and the push started a Release run."
              exit 0
            fi
            reason="The message of $MERGE_SHA is longer than the API returns, and no Release run started for this push to $BASE_REF."
          fi

          echo "::warning::$reason Dispatching release.yml on $BASE_REF."
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$BASE_REF"

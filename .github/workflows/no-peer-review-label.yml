name: Label PRs merged without peer review

# Tags a PR merged into main, alpha or release with `no-peer-review` when no
# one other than its author approved it, so those merges can be audited later.
#
# pull_request_target (not pull_request) so fork PRs get a writable token. This
# is safe because the job never checks out or runs the PR's code; it only reads
# the PR's reviews through the API.

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  label:
    name: Label if merged without peer review
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Check reviews and label
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'no-peer-review';
            const AUDITED_BASES = [ 'main', 'alpha', 'release' ];

            // Accounts whose approvals are automated even though GitHub reports
            // them as users. matticbot holds the GH_TOKEN that auto-merge.yml uses
            // to approve Dependabot PRs.
            const MACHINE_REVIEWERS = [ 'matticbot' ];

            // Bot authors whose PRs are reviewed by policy elsewhere: Dependabot
            // minor/patch bumps are auto-approved, and majors wait for a human.
            const SKIPPED_AUTHORS = [ 'dependabot[bot]' ];

            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const head = pr.head.ref;
            const author = pr.user.login;

            // Stacked and epic PRs into feature branches are reviewed when the
            // branch itself lands on main.
            if ( ! AUDITED_BASES.includes( base ) ) {
              core.info( `Base ${ base } is not audited; skipping.` );
              return;
            }

            if ( SKIPPED_AUTHORS.includes( author ) ) {
              core.info( `Author ${ author } is skipped.` );
              return;
            }

            // Branch promotions (main -> alpha -> release), reverts of them, and
            // release back-merges (sync/*, chore/forward-port-*) only move commits
            // that were already merged through their own PRs.
            const isPromotion =
              AUDITED_BASES.includes( head ) ||
              /^revert-\d+-(main|alpha|release)$/.test( head ) ||
              /^(sync\/|chore\/forward-port-)/.test( head );
            if ( isPromotion ) {
              core.info( `${ head } -> ${ base } is a promotion or sync; skipping.` );
              return;
            }

            const { owner, repo } = context.repo;
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: pr.number }
            );

            // A dismissed approval reports DISMISSED, so it no longer counts here.
            const peerApproved = reviews.some(
              ( review ) =>
                review.state === 'APPROVED' &&
                review.user &&
                review.user.type === 'User' &&
                review.user.login !== author &&
                ! MACHINE_REVIEWERS.includes( review.user.login )
            );
            if ( peerApproved ) {
              core.info( 'Approved by a peer; nothing to label.' );
              return;
            }

            await github.rest.issues.addLabels(
              { owner, repo, issue_number: pr.number, labels: [ LABEL ] }
            );
            core.info( `Labeled #${ pr.number } ${ LABEL }.` );

name: Release

on:
  push:
    branches:
      - release
      - alpha

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  PNPM_VERSION: 10.33.0
  # Pinned WP-CLI for the translation-file regeneration step: make-pot and
  # make-json output (including the md5-suffixed JSON translation filenames)
  # varies across i18n-command versions, so an unpinned binary could silently
  # rename generated files between releases. Keep in sync with i18n.yml.
  WP_CLI_VERSION: 2.12.0
  # sha512 of wp-cli-2.12.0.phar, pinned rather than fetched alongside the
  # download: the upstream .sha512 asset sits in the same replaceable release, so
  # fetching it proves only that two files agree. Keep in sync with i18n.yml.
  WP_CLI_SHA512: be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832
  # Every commit this workflow makes is automation-generated: the
  # @semantic-release/git prepare commit, the package.json version sync, and
  # the post-release branch-sync work (merge commits + the "restore
  # workspace:*" commit in post-release.sh). Skip the husky pre-commit lint
  # for all of them: the PHPCS wrapper hard-fails here (no root composer
  # install provisions vendor/bin/phpcs), and a lint gate on generated
  # release commits could block an already-published release anyway. Every PR
  # is fully linted by CI before merge, so nothing is lost. HUSKY=0 is the
  # documented bypass (see AGENTS.md).
  HUSKY: '0'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Dependent jobs must tell "released" from "ran and released nothing".
    # post-release.sh identifies what the release came from via `git log --skip
    # 1`, assuming an automated release commit at the tip. A no-release run
    # creates none, so that read lands a commit early, and a stale `Merge ...
    # alpha` sitting there sends it down the path that force-pushes alpha.
    outputs:
      release_needed: ${{ steps.plan.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.3'
          tools: composer
      - name: Configure git
        run: |
          git config user.name "newspack-release-bot"
          git config user.email "newspack-release-bot@users.noreply.github.com"
      - name: Install
        run: pnpm install --frozen-lockfile
      # Determine up front whether any package will actually release. A dry-run
      # runs only verifyConditions/analyzeCommits/generateNotes -- it never
      # enters the prepare step, so it never invokes release:archive and needs
      # no built assets. This lets us skip the multi-minute build below on the
      # common no-op push (e.g. only chore/ci commits since the last tag).
      - name: Plan release (does any package need a release?)
        id: plan
        run: |
          # A push that a newer push has already replaced must not fail. Push
          # twice in quick succession -- base-refreshing a hotfix branch minutes
          # apart does it -- and the older run still holds the older SHA, so
          # multi-semantic-release below refuses from a stale checkout and exits
          # non-zero with "The local branch <branch> is behind the remote one".
          # cancel-in-progress stays false on purpose (an in-flight real release
          # must never be interrupted), so the check has to live inside the job.
          #
          # "The tip moved" is not on its own a reason to skip: this workflow
          # only runs on branches that publish (the list lives in
          # config/release.js), so a skip nothing else covers loses a release
          # silently. Only skip when the
          # newer commit will get a run of its own, which needs two things to
          # hold. It must be a descendant of this SHA -- a force-push that
          # rewound the branch leaves this run as the only one that ever saw
          # these commits. And it must not be a [skip ci] commit -- that is how
          # semantic-release pushes its own version bump, and it starts no run,
          # so whatever this run was handed would never be released. Either way
          # the old behaviour stands: the dry-run below fails, which is the loud
          # signal a missed release needs.
          fetched=true
          git fetch --quiet --no-tags origin "+refs/heads/$GITHUB_REF_NAME" || fetched=false
          remote_tip=''
          if [ "$fetched" = true ]; then
            remote_tip=$(git rev-parse FETCH_HEAD 2>/dev/null) || remote_tip=''
          fi
          if [ -z "$remote_tip" ]; then
            echo "::warning::Could not read the remote tip of $GITHUB_REF_NAME; treating this run as current."
          elif [ "$remote_tip" != "$GITHUB_SHA" ]; then
            if git merge-base --is-ancestor "$GITHUB_SHA" "$remote_tip" &&
              ! git log -1 --format=%B "$remote_tip" | grep -qF '[skip ci]'; then
              echo "::notice::$GITHUB_SHA is no longer the tip of $GITHUB_REF_NAME (now $remote_tip); the newer push has a run of its own, so this one has nothing to do."
              echo "release_needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::$GITHUB_SHA is behind $GITHUB_REF_NAME (now $remote_tip), but the newer commit is a rewind or a [skip ci] commit that starts no run. Continuing, so a release this run cannot publish fails loudly."
          fi

          # Fail loud on any pipeline/log/grep error: a false "no release" here
          # would silently skip a real release, the one outcome we must avoid.
          set +e
          pnpm exec multi-semantic-release --dry-run --sequential-init 2>&1 | tee msr-dryrun.log
          # Copy the whole array in one go: PIPESTATUS is rebuilt after every
          # command, and an assignment is a command, so reading [1] on the line
          # after reading [0] returns empty and the tee check below never fires.
          pipe_status=("${PIPESTATUS[@]}")
          dryrun_status=${pipe_status[0]}
          tee_status=${pipe_status[1]}
          set -e
          if [ "$dryrun_status" -ne 0 ]; then
            echo "multi-semantic-release dry-run failed (exit $dryrun_status)"
            exit "$dryrun_status"
          fi
          if [ "$tee_status" -ne 0 ]; then
            echo "Failed to write the dry-run log (tee exit $tee_status)"
            exit "$tee_status"
          fi
          if [ ! -s msr-dryrun.log ]; then
            echo "Dry-run log is missing or empty; refusing to assume no release"
            exit 1
          fi
          # grep: 0 = match, 1 = no match, >=2 = error. Only 1 means "no release".
          # Case-insensitive: semantic-release logs "The next release version is
          # X" for an existing package, but "There is no previous release, the
          # next release version is X" for a package's first-ever release --
          # missing the latter would silently skip that release.
          # `|| grep_status=$?` rather than a bare call: under `set -e` a bare grep
          # that matches nothing exits 1 and kills the script, so the "no release
          # needed" branch below is never reached. Exit 2 (a real grep error) still
          # falls through to the failure branch.
          grep_status=0
          grep -qi 'the next release version is' msr-dryrun.log || grep_status=$?
          if [ "$grep_status" -eq 0 ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$grep_status" -eq 1 ]; then
            # Absence of the version phrase is weak evidence on its own: a
            # wording change upstream would read as "nothing to release" and
            # silently skip a real one. Require multi-semantic-release's own
            # zero-count line to corroborate before trusting the skip.
            zero_status=0
            # msr logs `Released 0 of 18 packages` when nothing is due and `Released 1
            # of 18 packages` when something is, so the count is real corroboration.
            # Matched loosely so a cosmetic reformat cannot redden a no-op push.
            grep -qiE 'released +0 +of +[0-9]+ +packages?' msr-dryrun.log || zero_status=$?
            if [ "$zero_status" -eq 1 ]; then
              echo "Neither a release version nor a zero-release marker found; the dry-run output may have changed."
              # Whole log: this fires when the shape is unknown, and a tail of a
              # multi-package run shows only the last package. `|| true` so exit 1 wins.
              cat msr-dryrun.log || true
              exit 1
            elif [ "$zero_status" -ne 0 ]; then
              echo "Failed to scan the dry-run log for the zero-release marker (grep exit $zero_status)"
              exit "$zero_status"
            fi
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "No package requires a release; skipping build and release."
          else
            echo "Failed to scan the dry-run log (grep exit $grep_status)"
            exit "$grep_status"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The dry-run runs semantic-release's verifyConditions, which calls
          # npm whoami. setup-node's registry-url wrote an .npmrc keyed on
          # ${NODE_AUTH_TOKEN}; without it npm auth 401s and the gate fails even
          # though the token is valid. Mirror the Release step below.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=12288
      - name: Build shared packages
        if: steps.plan.outputs.release_needed == 'true'
        run: pnpm run build:packages
      - name: Build all
        if: steps.plan.outputs.release_needed == 'true'
        run: pnpm run build
      # continue-on-error: this only enables translation regeneration, which is
      # non-blocking by design, so an apt or release-asset blip must not take a
      # product release with it. The script exits 2 when its tools are missing,
      # degrading down the same path as a failed unit.
      - name: Install WP-CLI and gettext
        if: steps.plan.outputs.release_needed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -O \
            "https://github.com/wp-cli/wp-cli/releases/download/v${WP_CLI_VERSION}/wp-cli-${WP_CLI_VERSION}.phar"
          # Digest line built here: the published .sha512 asset is a bare digest
          # with no filename, which sha512sum -c rejects as improperly formatted.
          printf '%s  wp-cli-%s.phar\n' "$WP_CLI_SHA512" "$WP_CLI_VERSION" | sha512sum -c -
          chmod +x "wp-cli-${WP_CLI_VERSION}.phar"
          sudo mv "wp-cli-${WP_CLI_VERSION}.phar" /usr/local/bin/wp
          wp --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
      # After "Build all" because make-pot scans the built bundles, and before
      # multi-semantic-release, which commits languages/** for each package it
      # releases. release:archive zips the working tree, so every channel's zip
      # carries fresh templates even where nothing is committed, and post-release
      # syncs the release commits back to main.
      #
      # No --strict: a failing unit is restored to its committed template and
      # reported rather than blocking an otherwise-good release. Dispatch the
      # i18n workflow to regenerate outside a release.
      - name: Regenerate translation files
        id: i18n
        if: steps.plan.outputs.release_needed == 'true'
        continue-on-error: true
        run: ./.github/scripts/update-translations.sh
      # Install each plugin's production PHP dependencies so release:archive
      # bundles vendor/ into the release zips. Without this the published zips
      # are missing composer dependencies (e.g. newspack-ads' googleads lib).
      - name: Install plugin PHP dependencies
        if: steps.plan.outputs.release_needed == 'true'
        run: |
          for dir in plugins/*/; do
            if [ -f "${dir}composer.json" ]; then
              echo "==> composer install in ${dir}"
              composer install --no-dev --no-interaction --no-scripts --working-dir="${dir}"
            fi
          done
      # Snapshot existing tags so the post-release Slack step can diff them
      # against the tags multi-semantic-release creates and report exactly which
      # packages were published.
      - name: Snapshot existing tags
        run: git tag > "$RUNNER_TEMP/tags-before.txt"
      - name: Release
        if: steps.plan.outputs.release_needed == 'true'
        run: pnpm exec multi-semantic-release --sequential-init
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's registry-url writes an .npmrc using ${NODE_AUTH_TOKEN};
          # without this it stays the literal "XXXXX-..." placeholder and npm
          # auth 401s. Set it to the same secret so npm actually authenticates.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=12288
      # package.json is deliberately excluded from the @semantic-release/git
      # prepare commit: that keeps multi-semantic-release's concretized
      # workspace:* deps off the branch (they'd break the next
      # `pnpm install --frozen-lockfile`, since the root lockfile is keyed to
      # workspace:*), while the npm publish phase still reads the concretized
      # working tree. The only thing lost is an up-to-date version on the branch,
      # which this step restores: it takes msr's working-tree version bumps,
      # reverts the internal deps back to workspace:*, and commits them once.
      # The [skip ci] commit won't re-trigger this workflow, and post-release.sh's
      # ancestry check is unaffected by the extra commit.
      #
      # Runs only on the `release` branch. Version/changelog stamps are authored
      # on a single channel (see config/release-helpers.js): the alpha prerelease
      # channel builds its zip/tag from the working-tree bump but never commits
      # it, so only `release` ever edits the version-stamp lines. That keeps the
      # committed CHANGELOG free of prerelease noise and stops post-release.sh's
      # release -> alpha / default-branch sync from colliding on version headers.
      # The prerelease zip is built from the working tree regardless, so nothing
      # downstream needs this commit.
      # Whatever is still uncommitted here has already served its purpose: the
      # zips were built from the working tree above. On the release branch that
      # is the units that did not release, since gitCommitStep committed the
      # ones that did; on prerelease channels it is everything, because
      # gitCommitStep returns no step there at all. Either way it goes nowhere
      # from this point, so drop it and let the steps below start from a clean
      # tree, since `git pull --rebase` refuses to run on a dirty one.
      #
      # The pathspecs need the trailing /* : a glob pathspec has to match the
      # full file path, so 'plugins/*/languages' alone matches nothing at all
      # and every command here silently becomes a no-op. The * crosses
      # directory separators, which is what reaches the classic theme's nested
      # themes/newspack-theme/newspack-theme/languages/. The final check is a
      # gate rather than a print, so a future edit that breaks the pathspecs
      # fails here instead of passing quietly.
      # continue-on-error: this runs after multi-semantic-release has published,
      # so a failure here would red-flag a shipped release and skip post-release
      # (which resets alpha and syncs main). A dirty tree breaks nothing anyway:
      # the version sync below rebases with autostash.
      - name: Discard uncommitted translation output
        if: steps.plan.outputs.release_needed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git checkout -- 'plugins/*/languages/*' 'themes/*/languages/*' 2> /dev/null || true
          git clean -fdq -- 'plugins/*/languages/*' 'themes/*/languages/*'
          leftover=$(git status --porcelain -- 'plugins/*/languages/*' 'themes/*/languages/*')
          if [ -n "$leftover" ]; then
            echo "::warning title=i18n::Translation files still uncommitted after cleanup"
            printf '%s\n' "$leftover"
            exit 1
          fi

      - name: Sync package.json versions
        if: ${{ github.ref_name == 'release' }}
        run: |
          node .github/scripts/finalize-package-versions.cjs
          # The release is already published by this point, so the branch must not
          # be left without the synced version. If a concurrent push to the same
          # ref rejects ours, rebase the sync commit on top and retry.
          # autoStash as a backstop: the discard step above should have left the
          # tree clean, and this recovery path runs after packages are published,
          # so it must not be the thing that fails.
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git -c rebase.autoStash=true pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      # Post a release-success summary to Slack: stable releases (release branch)
      # go to the a8c workspace, alpha releases to the Newspack workspace.
      # Only the workspace for this branch's release type gets its token, so an
      # alpha run never sees the a8c token and vice versa (the empty fallback is
      # fine: the script skips when its token/channel is unset). continue-on-error
      # is a backstop so a notification hiccup can never fail an already-published
      # release; the script also traps errors and exits 0 on its own.
      - name: Notify Slack of release
        if: ${{ success() && ( github.ref_name == 'release' || github.ref_name == 'alpha' ) }}
        continue-on-error: true
        env:
          TAGS_BEFORE_FILE: ${{ runner.temp }}/tags-before.txt
          SLACK_AUTH_TOKEN: ${{ github.ref_name == 'release' && secrets.SLACK_AUTH_TOKEN || '' }}
          SLACK_NEWSPACK_BOT_TOKEN: ${{ github.ref_name == 'alpha' && secrets.SLACK_NEWSPACK_BOT_TOKEN || '' }}
          SLACK_A8C_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_A8C_RELEASE_CHANNEL_ID }}
          SLACK_NEWSPACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_NEWSPACK_RELEASE_CHANNEL_ID }}
          SLACK_SUPPORT_TEAM_SUBTEAM_ID: ${{ github.ref_name == 'release' && secrets.SLACK_SUPPORT_TEAM_SUBTEAM_ID || '' }}
          # The script writes I18N_FAILED_UNITS only at the end of a normal run,
          # so a step that died earlier leaves it empty. The outcome fallback
          # keeps a whole-step failure from passing as a clean release.
          I18N_FAILED_UNITS: ${{ steps.i18n.outcome == 'failure' && 'regeneration step failed, see the job log' || env.I18N_FAILED_UNITS }}
        run: ./.github/scripts/notify-release.sh

  # Branch maintenance after a stable release: reset alpha and sync release into
  # the default branch. Only runs on the release branch (not alpha).
  post-release:
    name: Post-release branch sync
    if: github.ref == 'refs/heads/release' && needs.release.outputs.release_needed == 'true'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "newspack-release-bot"
          git config user.email "newspack-release-bot@users.noreply.github.com"
      - name: Post-release branch maintenance
        env:
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_AUTH_TOKEN: ${{ secrets.SLACK_AUTH_TOKEN }}
        run: ./.github/scripts/post-release.sh

  # WP.org deploys are plugin-specific and only run on the release branch.
  release-wporg-newsletters:
    name: WP.org / newspack-newsletters
    if: github.ref == 'refs/heads/release' && needs.release.outputs.release_needed == 'true'
    needs: release
    uses: ./.github/workflows/_release-wporg.yml
    with:
      plugin-name: newspack-newsletters
      plugin-path: plugins/newspack-newsletters
    secrets:
      WP_ORG_USERNAME: ${{ secrets.WP_ORG_USERNAME }}
      WP_ORG_PASSWORD: ${{ secrets.WP_ORG_PASSWORD }}

  release-wporg-scaip:
    name: WP.org / super-cool-ad-inserter
    if: github.ref == 'refs/heads/release' && needs.release.outputs.release_needed == 'true'
    needs: release
    uses: ./.github/workflows/_release-wporg.yml
    with:
      plugin-name: super-cool-ad-inserter
      plugin-path: plugins/super-cool-ad-inserter
    secrets:
      WP_ORG_USERNAME: ${{ secrets.WP_ORG_USERNAME }}
      WP_ORG_PASSWORD: ${{ secrets.WP_ORG_PASSWORD }}

  release-wporg-rtt:
    name: WP.org / republication-tracker-tool
    if: github.ref == 'refs/heads/release' && needs.release.outputs.release_needed == 'true'
    needs: release
    uses: ./.github/workflows/_release-wporg.yml
    with:
      plugin-name: republication-tracker-tool
      plugin-path: plugins/republication-tracker-tool
    secrets:
      WP_ORG_USERNAME: ${{ secrets.WP_ORG_USERNAME }}
      WP_ORG_PASSWORD: ${{ secrets.WP_ORG_PASSWORD }}

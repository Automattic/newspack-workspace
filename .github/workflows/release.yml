name: Release

on:
  push:
    branches:
      - release
      - alpha
      - 'hotfix/**'
      - 'epic/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  PNPM_VERSION: 10.33.0
  # Every commit this workflow makes is automation-generated: the
  # @semantic-release/git prepare commit, the package.json version sync, and
  # the post-release branch-sync work (merge commits + the "restore
  # workspace:*" commit in post-release.sh). Skip the husky pre-commit lint
  # for all of them: the PHPCS wrapper hard-fails here (no root composer
  # install provisions vendor/bin/phpcs), and a lint gate on generated
  # release commits could block an already-published release anyway. Every PR
  # is fully linted by CI before merge, so nothing is lost. HUSKY=0 is the
  # documented bypass (see AGENTS.md).
  HUSKY: '0'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      # Newline-separated `<pkg>@<version>` tags created by this run, consumed
      # by the WP.org deploy jobs below to tell "this plugin released" from
      # "this plugin was untouched". See the "Collect released tags" step.
      released-tags: ${{ steps.released.outputs.tags }}
      # The commit this job left the branch on -- the one carrying the released
      # versions. The WP.org deploy jobs build that exact commit rather than the
      # branch tip, which keeps moving. See the "Sync package.json versions"
      # step and the checkout in _release-wporg.yml.
      released-sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.3'
          tools: composer
      - name: Configure git
        run: |
          git config user.name "newspack-release-bot"
          git config user.email "newspack-release-bot@users.noreply.github.com"
      - name: Install
        run: pnpm install --frozen-lockfile
      # Determine up front whether any package will actually release. A dry-run
      # runs only verifyConditions/analyzeCommits/generateNotes -- it never
      # enters the prepare step, so it never invokes release:archive and needs
      # no built assets. This lets us skip the multi-minute build below on the
      # common no-op push (e.g. only chore/ci commits since the last tag).
      - name: Plan release (does any package need a release?)
        id: plan
        run: |
          # Fail loud on any pipeline/log/grep error: a false "no release" here
          # would silently skip a real release, the one outcome we must avoid.
          set +e
          pnpm exec multi-semantic-release --dry-run --sequential-init 2>&1 | tee msr-dryrun.log
          dryrun_status=${PIPESTATUS[0]}
          tee_status=${PIPESTATUS[1]}
          set -e
          if [ "$dryrun_status" -ne 0 ]; then
            echo "multi-semantic-release dry-run failed (exit $dryrun_status)"
            exit "$dryrun_status"
          fi
          if [ "$tee_status" -ne 0 ]; then
            echo "Failed to write the dry-run log (tee exit $tee_status)"
            exit "$tee_status"
          fi
          if [ ! -s msr-dryrun.log ]; then
            echo "Dry-run log is missing or empty; refusing to assume no release"
            exit 1
          fi
          # grep: 0 = match, 1 = no match, >=2 = error. Only 1 means "no release".
          # Case-insensitive: semantic-release logs "The next release version is
          # X" for an existing package, but "There is no previous release, the
          # next release version is X" for a package's first-ever release --
          # missing the latter would silently skip that release.
          grep -qi 'the next release version is' msr-dryrun.log
          grep_status=$?
          if [ "$grep_status" -eq 0 ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$grep_status" -eq 1 ]; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "No package requires a release; skipping build and release."
          else
            echo "Failed to scan the dry-run log (grep exit $grep_status)"
            exit "$grep_status"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The dry-run runs semantic-release's verifyConditions, which calls
          # npm whoami. setup-node's registry-url wrote an .npmrc keyed on
          # ${NODE_AUTH_TOKEN}; without it npm auth 401s and the gate fails even
          # though the token is valid. Mirror the Release step below.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=12288
      - name: Build shared packages
        if: steps.plan.outputs.release_needed == 'true'
        run: pnpm run build:packages
      - name: Build all
        if: steps.plan.outputs.release_needed == 'true'
        run: pnpm run build
      # Install each plugin's production PHP dependencies so release:archive
      # bundles vendor/ into the release zips. Without this the published zips
      # are missing composer dependencies (e.g. newspack-ads' googleads lib).
      - name: Install plugin PHP dependencies
        if: steps.plan.outputs.release_needed == 'true'
        run: |
          for dir in plugins/*/; do
            if [ -f "${dir}composer.json" ]; then
              echo "==> composer install in ${dir}"
              composer install --no-dev --no-interaction --no-scripts --working-dir="${dir}"
            fi
          done
      # Snapshot existing tags so the post-release Slack step can diff them
      # against the tags multi-semantic-release creates and report exactly which
      # packages were published.
      - name: Snapshot existing tags
        run: git tag > "$RUNNER_TEMP/tags-before.txt"
      - name: Release
        if: steps.plan.outputs.release_needed == 'true'
        run: pnpm exec multi-semantic-release --sequential-init
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's registry-url writes an .npmrc using ${NODE_AUTH_TOKEN};
          # without this it stays the literal "XXXXX-..." placeholder and npm
          # auth 401s. Set it to the same secret so npm actually authenticates.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=12288
      # Which packages actually published, as `<pkg>@<version>` tags. Same
      # before/after tag diff notify-release.sh uses for its Slack summary,
      # surfaced as a job output so the WP.org deploy jobs can gate on it:
      # without it they cannot tell a plugin that had no release from one whose
      # deploy silently resolved a stale version. Always runs, so a skipped
      # release yields an empty list rather than a missing output.
      #
      # Every command here must fail loudly. An empty list is meaningful -- the
      # deploy jobs read it as "this plugin had no release" and skip -- so a
      # swallowed error would silently skip every WP.org deploy of a real
      # release, which is the exact failure this gating exists to prevent.
      # Hence no `|| true`, pipefail on, and both sides materialised as files
      # rather than process substitutions (whose exit status bash discards).
      #
      # `--merged HEAD` restricts the diff to tags on this branch's history, so
      # it measures what this run created rather than what appeared. The
      # concurrency group is per-ref, so an alpha release runs alongside a
      # stable one by design and tags into the same namespace, and
      # semantic-release fetches tags on every invocation -- an alpha tag
      # pushed while the release step ran would otherwise land in this list.
      # The deploy gate would then find a tag for the plugin but no match at
      # the stable version, and fail the run as a stale checkout, minutes after
      # npm and GitHub had already published.
      - name: Collect released tags
        id: released
        run: |
          set -euo pipefail
          sort "$RUNNER_TEMP/tags-before.txt" > "$RUNNER_TEMP/tags-before-sorted.txt"
          git tag --merged HEAD | sort > "$RUNNER_TEMP/tags-after-sorted.txt"
          new_tags=$(comm -13 "$RUNNER_TEMP/tags-before-sorted.txt" "$RUNNER_TEMP/tags-after-sorted.txt")
          echo "Tags created by this run:"
          echo "${new_tags:-(none)}"
          {
            echo 'tags<<RELEASED_TAGS_EOF'
            echo "$new_tags"
            echo 'RELEASED_TAGS_EOF'
          } >> "$GITHUB_OUTPUT"
      # package.json is deliberately excluded from the @semantic-release/git
      # prepare commit: that keeps multi-semantic-release's concretized
      # workspace:* deps off the branch (they'd break the next
      # `pnpm install --frozen-lockfile`, since the root lockfile is keyed to
      # workspace:*), while the npm publish phase still reads the concretized
      # working tree. The only thing lost is an up-to-date version on the branch,
      # which this step restores: it takes msr's working-tree version bumps,
      # reverts the internal deps back to workspace:*, and commits them once.
      # The [skip ci] commit won't re-trigger this workflow, and post-release.sh's
      # ancestry check is unaffected by the extra commit.
      #
      # Runs only on the `release` branch. Version/changelog stamps are authored
      # on a single channel (see config/release-helpers.js): prerelease channels
      # (alpha, hotfix/*, epic/*) build their zip/tag from the working-tree bump
      # but never commit it, so only `release` ever edits the version-stamp
      # lines. That keeps the committed CHANGELOG free of prerelease noise and
      # stops post-release.sh's release -> alpha / default-branch sync from
      # colliding on version headers. The prerelease zip is built from the
      # working tree regardless, so nothing downstream needs this commit.
      - name: Sync package.json versions
        id: sync
        if: ${{ github.ref_name == 'release' }}
        run: |
          node .github/scripts/finalize-package-versions.cjs
          # The release is already published by this point, so the branch must not
          # be left without the synced version. If a concurrent push to the same
          # ref rejects ours, rebase the sync commit on top and retry.
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }
          # Published after the push, so it names a commit that exists on the
          # remote for the deploy jobs to check out. Pinning them to this SHA is
          # what makes the deployed tree exactly the released one: the branch tip
          # can move underneath them, and a version-only check cannot see that,
          # since a code-only commit leaves every version untouched.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Post a release-success summary to Slack: stable releases (release branch)
      # go to the a8c workspace, alpha releases to the Newspack workspace. Only
      # these two branches notify; hotfix/* and epic/* publish silently.
      # Only the workspace for this branch's release type gets its token, so an
      # alpha run never sees the a8c token and vice versa (the empty fallback is
      # fine: the script skips when its token/channel is unset). continue-on-error
      # is a backstop so a notification hiccup can never fail an already-published
      # release; the script also traps errors and exits 0 on its own.
      - name: Notify Slack of release
        if: ${{ success() && ( github.ref_name == 'release' || github.ref_name == 'alpha' ) }}
        continue-on-error: true
        env:
          TAGS_BEFORE_FILE: ${{ runner.temp }}/tags-before.txt
          SLACK_AUTH_TOKEN: ${{ github.ref_name == 'release' && secrets.SLACK_AUTH_TOKEN || '' }}
          SLACK_NEWSPACK_BOT_TOKEN: ${{ github.ref_name == 'alpha' && secrets.SLACK_NEWSPACK_BOT_TOKEN || '' }}
          SLACK_A8C_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_A8C_RELEASE_CHANNEL_ID }}
          SLACK_NEWSPACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_NEWSPACK_RELEASE_CHANNEL_ID }}
          SLACK_SUPPORT_TEAM_SUBTEAM_ID: ${{ github.ref_name == 'release' && secrets.SLACK_SUPPORT_TEAM_SUBTEAM_ID || '' }}
        run: ./.github/scripts/notify-release.sh

  # Branch maintenance after a stable release: reset alpha and sync release into
  # the default branch. Only runs on the release branch (not alpha/hotfix/epic).
  post-release:
    name: Post-release branch sync
    if: github.ref == 'refs/heads/release'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "newspack-release-bot"
          git config user.email "newspack-release-bot@users.noreply.github.com"
      - name: Post-release branch maintenance
        env:
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_AUTH_TOKEN: ${{ secrets.SLACK_AUTH_TOKEN }}
        run: ./.github/scripts/post-release.sh

  # WP.org deploys are plugin-specific and only run on the release branch.
  release-wporg-newsletters:
    name: WP.org / newspack-newsletters
    if: github.ref == 'refs/heads/release'
    needs: release
    uses: ./.github/workflows/_release-wporg.yml
    with:
      plugin-name: newspack-newsletters
      plugin-path: plugins/newspack-newsletters
      ref: ${{ needs.release.outputs.released-sha }}
      released-tags: ${{ needs.release.outputs.released-tags }}
      require-release: true
    secrets:
      WP_ORG_USERNAME: ${{ secrets.WP_ORG_USERNAME }}
      WP_ORG_PASSWORD: ${{ secrets.WP_ORG_PASSWORD }}

  release-wporg-scaip:
    name: WP.org / super-cool-ad-inserter
    if: github.ref == 'refs/heads/release'
    needs: release
    uses: ./.github/workflows/_release-wporg.yml
    with:
      plugin-name: super-cool-ad-inserter
      plugin-path: plugins/super-cool-ad-inserter
      ref: ${{ needs.release.outputs.released-sha }}
      released-tags: ${{ needs.release.outputs.released-tags }}
      require-release: true
    secrets:
      WP_ORG_USERNAME: ${{ secrets.WP_ORG_USERNAME }}
      WP_ORG_PASSWORD: ${{ secrets.WP_ORG_PASSWORD }}

  release-wporg-rtt:
    name: WP.org / republication-tracker-tool
    if: github.ref == 'refs/heads/release'
    needs: release
    uses: ./.github/workflows/_release-wporg.yml
    with:
      plugin-name: republication-tracker-tool
      plugin-path: plugins/republication-tracker-tool
      ref: ${{ needs.release.outputs.released-sha }}
      released-tags: ${{ needs.release.outputs.released-tags }}
      require-release: true
    secrets:
      WP_ORG_USERNAME: ${{ secrets.WP_ORG_USERNAME }}
      WP_ORG_PASSWORD: ${{ secrets.WP_ORG_PASSWORD }}

version: 2

updates:
  # Root npm dependencies (pnpm workspace).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Group minor/patch updates to reduce PR noise.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Root composer dependencies (PHPCS, PHPUnit, etc.).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # vipwpcs 3.1.0 enables NoPaging, which errors on every existing
      # `posts_per_page => -1` in the monorepo. composer.json pins it to ~3.0.1
      # until NPPM-3055 audits those call sites; without this entry the weekly
      # "permit the latest version" PR raises the constraint again and
      # auto-merge.yml lands it, which is how the first pin was lost.
      - dependency-name: "automattic/vipwpcs"

  # GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Per-plugin production composer deps (only plugins that have them).
  - package-ecosystem: "composer"
    directory: "plugins/newspack-plugin"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "composer"
    directory: "plugins/newspack-ads"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "composer"
    directory: "plugins/newspack-newsletters"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "composer"
    directory: "plugins/newspack-popups"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

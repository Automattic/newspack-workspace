version: 2

updates:
  # Root npm dependencies (pnpm workspace).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Group minor/patch updates to reduce PR noise.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Root composer dependencies (PHPCS, PHPUnit, etc.).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # VIPCS 3.1.0 makes `posts_per_page => -1` a hard error, which the
      # monorepo does not yet satisfy, so the root constraint stays on 3.0.x
      # until that audit lands (NPPM-3055). The pin alone is not enough:
      # Dependabot also opens "permit the latest version" PRs that rewrite the
      # constraint itself, and one of those reverted this pin and turned every
      # PHP-linted PR red. Drop this entry as part of the audit.
      - dependency-name: "automattic/vipwpcs"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Per-plugin production composer deps (only plugins that have them).
  - package-ecosystem: "composer"
    directory: "plugins/newspack-plugin"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "composer"
    directory: "plugins/newspack-ads"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "composer"
    directory: "plugins/newspack-newsletters"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
  - package-ecosystem: "composer"
    directory: "plugins/newspack-popups"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

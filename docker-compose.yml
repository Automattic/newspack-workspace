name: newspack-docker

volumes:
  ## Kludge for not having the ./docker directory bound recursively
  dockerdirectory:

services:
  ## A default mysql image
  ## We map a local directory (data/mysql) so we can have the mysql data locally
  ## and reuse it if we need to remove containers and images for rebuilding from scratch.
  db:
    image: mariadb:11.8.6
    volumes:
      - ./data/newspack-dev_mysql:/var/lib/mysql
      - ./logs/newspack-dev/mysql:/var/log/mysql
      - ./config/mysql.conf:/etc/mysql/conf.d/docker.cnf
      - ./bin:/var/scripts
    env_file:
      - default.env
      - .env
    entrypoint: ["/bin/bash", "/var/scripts/docker-db-start-and-autoupgrade.sh"]
    command: ["mariadbd"]

  ## - The container wordpress is a very basic but custom container with WordPress and all of the tools we need
  ##   for development.
  ## - The container will be named jetpack_wordpress for easy reference when running docker/docker-compose commands
  ##
  ## Here we map the following:
  ##  - The docker/wordpress-develop directory where we'll get WordPress source code with unit tests
  ##  - The docker/wordpress directory so we can have WordPress source code modifiable from the host file system
  ##  - The docker/logs/apache2 directory so we can access Apache log files directly from the host file system
  ##  - The docker/logs/php directory so we can access PHP log files directly from the host file system
  ##  - The docker/bin directory for provisioning scripts
  wordpress:
    container_name: newspack_dev
    platform: ${NEWSPACK_DOCKER_PLATFORM:-linux/arm64}
    depends_on:
      - db
    image: newspack-dev:latest
    volumes:
      - ./logs/newspack-dev/apache2/:/var/log/apache2
      - ./logs/newspack-dev/php:/var/log/php
      - ./bin:/var/scripts
      - .:/newspack-monorepo
      - ./plugins:/newspack-plugins
      - ./themes:/newspack-themes
      - ./repos:/newspack-repos
      - ./html:/var/www/html
      - ./manager-html:/var/www/manager-html
      - ./additional-sites-html:/var/www/additional-sites-html
      - ./snapshots:/snapshots
    ## No published ports: the proxy below listens on 80 and 443 for every site
    ## and sends this one any hostname no isolated env claims. That covers
    ## localhost, the additional sites and the manager hub.
    env_file:
      - default.env
      - .env
    environment:
      - HOST_PORT=${PORT_WORDPRESS:-80}
      # - COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME
      - APACHE_RUN_USER=${USE_CUSTOM_APACHE_USER:-www-data}
      - WP_ENVIRONMENT_TYPE=local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ## Apache runs in the foreground, so it takes the container down with it when
    ## it dies. memcached does not: it can exit and leave a container that looks
    ## healthy while the object cache quietly stops invalidating. The in-container
    ## watchdog restarts it within ~30s, so this probe is the second line of
    ## defence -- it reports unhealthy only for a memcached the watchdog could not
    ## revive. start_period covers a cold boot, where memcached starts only after
    ## init-wp.sh has downloaded WordPress and waited for MariaDB.
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/11211"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
  ## The one listener for every site, main and isolated.
  ##
  ## Docker Desktop for Mac 4.97+ binds ports below 1024 on all interfaces, so a
  ## second container publishing 443 fails whatever loopback address it asks for.
  ## The proxy takes both ports once and routes by hostname.
  ##
  ## TLS is passed through, not terminated: each site keeps serving its own
  ## mkcert certificate and nothing inside the site containers changes.
  ##
  ## Routes are files in .proxy-routes, written by `n` (see env_proxy_route and
  ## sync_proxy_routes in bin/_common.sh) and picked up as they change. The proxy
  ## deliberately has no Docker socket: discovering containers through it would
  ## give this third-party image control of Docker itself. For the same reason
  ## it runs as an unprivileged user on a read-only filesystem, and the image is
  ## pinned by digest so an upstream change cannot arrive unreviewed. Dependabot
  ## proposes the bumps, and auto-merge leaves them for a person.
  ##
  ## depends_on makes Compose replace a wordpress container that still
  ## publishes 443 itself before it starts the proxy, which needs that port.
  proxy:
    container_name: newspack_proxy
    image: traefik:v3.7.20@sha256:8301d6f60957a422f98918aacf2b01482abde3e74ead3719aabdb7c64045fe28
    depends_on:
      - wordpress
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      ## A tunnel that terminates TLS reaches the site on port 80 and says so in
      ## X-Forwarded-Proto, which the site reads to build its https URLs. The
      ## proxy would replace that header with its own. Trusting it adds nothing
      ## new: Apache took these headers from any local client before the proxy
      ## sat in front of it. The proxy still appends its own peer address to
      ## X-Forwarded-For, and adds X-Real-Ip with that address to a request
      ## that has none. Code that prefers X-Real-Ip therefore sees a Docker
      ## address for a tunnel that sends only X-Forwarded-For.
      - --entrypoints.web.forwardedheaders.insecure=true
      - --entrypoints.websecure.address=:443
      ## Traefik otherwise reports its version and the machine's public address
      ## to its vendor. Usage statistics are off by default already; the flag
      ## keeps that from depending on the default.
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    ports:
      - "127.0.0.1:${PORT_WORDPRESS:-80}:80"
      - "127.0.0.1:${PORT_WORDPRESS:-443}:443"
    volumes:
      - ./.proxy-routes:/etc/traefik/dynamic:ro
    networks:
      - default
      - newspack_envs
  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8088:8080"

## Shared with the isolated envs, which join it under their domain. Created by
## `n start` (ensure_envs_network), so it outlives `docker compose down`.
networks:
  newspack_envs:
    external: true
